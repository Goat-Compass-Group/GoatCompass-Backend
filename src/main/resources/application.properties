# APPLICATION
spring.application.name=GOATCOMPASS-BACKEND
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
# SQL
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# REDIS
spring.data.redis.url=${REDIS_URL}
spring.data.redis.repositories.enabled=false
# SPRING MODULITH
spring.modulith.events.completion-mode=archive
# DATA IMPORT
app.data-import.enabled=${DATA_IMPORT_ENABLED}
# SECURITY
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token.expiration-second=${JWT_ACCESS_TOKEN_EXPIRATION_SECOND}
app.jwt.refresh-token.expiration-second=${JWT_REFRESH_TOKEN_EXPIRATION_SECOND}
app.verify-code-validity-in-second=${VERIFICATION_CODE_VALIDITY_IN_SECOND}
# COOKIE
app.cookie.domain=${COOKIE_DOMAIN}
app.cookie.secure=${COOKIE_SECURE}
# MAIL
spring.mail.host=${HOST_MAIL}
spring.mail.port=${PORT_MAIL}
spring.mail.username=${USERNAME_MAIL}
spring.mail.password=${PASSWORD_MAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${FROM_MAIL}
# RATE LIMIT
app.rate-limit.login.max-attempts=${RATE_LIMIT_LOGIN_MAX}
app.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW}
app.rate-limit.otp.max-attempts=${RATE_LIMIT_OTP_MAX}
app.rate-limit.otp.window-seconds=${RATE_LIMIT_OTP_WINDOW}
app.rate-limit.verify.max-attempts=${RATE_LIMIT_VERIFY_MAX}
app.rate-limit.verify.window-seconds=${RATE_LIMIT_VERIFY_WINDOW}
app.rate-limit.password-reset.max-attempts=${RATE_LIMIT_PASSWORD_RESET_MAX}
app.rate-limit.password-reset.window-seconds=${RATE_LIMIT_PASSWORD_RESET_WINDOW}
# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# LOGGING
logging.level.root=INFO
logging.level.com.goatcompass=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId:-}] - %msg%n
# SWAGGER
springdoc.api-docs.enabled=false
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.enabled=false
# PAGINATION
spring.data.web.pageable.max-page-size=20
# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh