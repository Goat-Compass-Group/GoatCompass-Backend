  # --- Kế toán – Tài chính (mẫu) --------------------------------------------------
  - code: vietnam-cpa
    name_vi: Chứng chỉ kiểm toán viên (CPA Việt Nam)
    name_en: Vietnamese CPA Certificate
    kind: LICENSE
    issuer: Bộ Tài chính
    url: https://mof.gov.vn
    prep_weeks: 104
    note_vi: >-
      Thi nhiều môn qua nhiều kỳ. Để ký báo cáo kiểm toán còn cần đăng ký hành nghề kiểm toán
      và đáp ứng điều kiện kinh nghiệm theo Luật Kiểm toán độc lập.
    skills:
      - { skill: financial-statement-audit, level: 3 }
      - { skill: financial-reporting, level: 3 }
      - { skill: vietnamese-accounting-standards, level: 3 }
      - { skill: tax-accounting, level: 2 }

  - code: acca
    name_vi: Chứng chỉ ACCA
    name_en: ACCA Qualification
    kind: CERTIFICATE
    issuer: ACCA
    url: https://www.accaglobal.com
    prep_weeks: 156
    note_vi: Chứng chỉ quốc tế tự nguyện; được nhiều công ty kiểm toán và doanh nghiệp FDI ưu tiên.
    skills:
      - { skill: ifrs, level: 3 }
      - { skill: financial-reporting, level: 3 }
      - { skill: financial-statement-audit, level: 2 }

  - code: bachelor-accounting
    name_vi: Cử nhân Kế toán / Kiểm toán
