        - { skill: keyword-research, level: 3 }
        - { skill: on-page-seo, level: 3 }
        - { skill: technical-seo, level: 2 }
        - { skill: google-search-console, level: 2 }
        - { skill: google-analytics, level: 2 }
        - { skill: content-writing, level: 2 }
      optional:
        - { skill: off-page-seo, level: 2 }
        - { skill: marketing-reporting, level: 2 }
        - { skill: looker-studio, level: 1 }
        - { skill: english, level: 2 }

