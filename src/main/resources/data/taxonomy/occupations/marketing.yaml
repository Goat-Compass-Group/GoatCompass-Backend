occupations:
  - code: digital-marketing-specialist
    name_vi: Chuyên viên Digital Marketing
    name_en: Digital Marketing Specialist
    job_families: [marketing]
    description_vi: Triển khai đa kênh online (nội dung, mạng xã hội, quảng cáo, SEO) và báo cáo hiệu quả.
    aliases:
      vi: [nhân viên digital marketing, nhân viên marketing online, chuyên viên marketing online]
      en: [digital marketing executive, online marketing specialist, digital marketer]
    external_refs:
      - { scheme: ISCO08, code: "2431", match: BROAD }
      - { scheme: ONET, code: "13-1161.00", match: BROAD }
    skills:
      essential:
        - { skill: marketing-fundamentals, level: 2 }
        - { skill: content-writing, level: 2 }
        - { skill: social-media-management, level: 2 }
        - { skill: meta-ads, level: 2 }
        - { skill: google-analytics, level: 2 }
        - { skill: marketing-reporting, level: 2 }
        - { skill: on-page-seo, level: 1 }
      optional:
        - { skill: google-ads, level: 2 }
        - { skill: tiktok-ads, level: 1 }
        - { skill: email-marketing, level: 1 }
        - { skill: crm-marketing-tools, level: 1 }
        - { skill: conversion-tracking, level: 1 }
        - { skill: graphic-design-basic, level: 1 }
        - { skill: spreadsheet-excel, level: 2 }
        - { skill: english, level: 2 }
    credentials:
      - { credential: google-ads-search-certification, requirement: PREFERRED }
      - { credential: google-analytics-certification, requirement: PREFERRED }
      - { credential: meta-certified-digital-marketing-associate, requirement: PREFERRED }

  - code: performance-marketing-specialist
    name_vi: Chuyên viên Performance Marketing
    name_en: Performance Marketing Specialist
    job_families: [marketing]
    description_vi: Chạy và tối ưu quảng cáo trả phí theo mục tiêu chuyển đổi, chịu trách nhiệm ngân sách và chỉ số CPA/ROAS.
    aliases:
      vi: [nhân viên chạy quảng cáo, chuyên viên quảng cáo, nhân viên ads, chuyên viên ads, media buyer]
      en: [media buyer, paid media specialist, ads specialist, ppc specialist, performance marketer]
    external_refs:
      - { scheme: ISCO08, code: "2431", match: BROAD }
    skills:
      essential:
        - { skill: paid-advertising, level: 3 }
        - { skill: meta-ads, level: 3 }
        - { skill: google-ads, level: 2 }
        - { skill: conversion-tracking, level: 2 }
        - { skill: marketing-reporting, level: 2 }
        - { skill: ab-testing, level: 2 }
        - { skill: marketing-budget-management, level: 2 }
        - { skill: spreadsheet-excel, level: 2 }
      optional:
        - { skill: tiktok-ads, level: 2 }
        - { skill: zalo-ads, level: 1 }
        - { skill: marketplace-ads, level: 1 }
        - { skill: google-analytics, level: 2 }
        - { skill: looker-studio, level: 2 }
        - { skill: copywriting, level: 1 }
    credentials:
      - { credential: meta-certified-media-buying-professional, requirement: PREFERRED }
      - { credential: google-ads-search-certification, requirement: PREFERRED }

  - code: seo-specialist
    name_vi: Chuyên viên SEO
    name_en: SEO Specialist
    job_families: [marketing]
    description_vi: Tăng lượng truy cập tự nhiên từ công cụ tìm kiếm thông qua tối ưu nội dung, kỹ thuật và liên kết.
    aliases:
      vi: [nhân viên seo, chuyên viên tối ưu website, seoer]
      en: [seo executive, seo analyst, search marketing specialist]
    external_refs:
      - { scheme: ISCO08, code: "2431", match: BROAD }
      - { scheme: ONET, code: "13-1161.01", match: CLOSE }
    skills:
      essential:
