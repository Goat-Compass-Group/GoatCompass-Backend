    weeks_to_working: 3
    description_vi: Dùng thành thạo bộ công cụ văn phòng (soạn thảo, bảng tính, trình chiếu).
    aliases:
      vi: [sử dụng máy tính văn phòng, word excel powerpoint]
      en: [microsoft office, ms office, office suite, google workspace]

  - code: spreadsheet-excel
    name_vi: Excel / Google Sheets
