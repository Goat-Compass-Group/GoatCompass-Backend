server.port=0
# Datasource do Testcontainers cung cấp (@ServiceConnection trong TestcontainersConfiguration)
spring.jpa.open-in-view=false
# Liquibase chạy đủ changelog trên Postgres thật, Hibernate kiểm tra entity khớp schema
spring.jpa.hibernate.ddl-auto=validate

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=WARN

# Không tự nạp dữ liệu lúc khởi động test; test nào cần thì gọi DataImportService trong transaction riêng
app.data-import.enabled=false
security.cors.allowed-origins=http://localhost:5173
