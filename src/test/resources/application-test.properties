server.port=0
# Datasource do Testcontainers cung cấp (@ServiceConnection trong TestcontainersConfiguration)
spring.jpa.open-in-view=false
# Liquibase chạy đủ changelog trên Postgres thật, Hibernate kiểm tra entity khớp schema
spring.jpa.hibernate.ddl-auto=validate

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=WARN

# Không tự nạp dữ liệu lúc khởi động test; test nào cần thì gọi DataImportService trong transaction riêng
app.data-import.enabled=false
security.cors.allowed-origins=http://localhost:5173

# Redis do Testcontainers cung cấp (@ServiceConnection ghi đè url này)
spring.data.redis.url=redis://localhost:6379
app.jwt.secret=Fr9gigUhIwHEIiEnFtMd7gyPgHWNM3CuIjFUZc8sehrwuR1Y2YEoG+cqq5ZfMKyX
app.jwt.access-token.expiration-second=300
app.jwt.refresh-token.expiration-second=3600
app.verify-code-validity-in-second=900
app.cookie.domain=
app.cookie.secure=false
# Test không gửi mail thật: EmailNotificationPort được mock trong test auth, ResendEmailSenderTest dùng server giả
app.mail.from=GoatCompass <no-reply@goatcompass.test>
app.mail.resend.base-url=https://api.resend.com
app.mail.resend.api-key=re_test
app.rate-limit.login.max-attempts=5
app.rate-limit.login.window-seconds=60
app.rate-limit.otp.max-attempts=3
app.rate-limit.otp.window-seconds=3600
app.rate-limit.verify.max-attempts=5
app.rate-limit.verify.window-seconds=900
app.rate-limit.password-reset.max-attempts=5
app.rate-limit.password-reset.window-seconds=86400
